<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Database key explorer (Supabase)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#f1f4f1;--panel:#fbfcfb;--ink:#14211c;--muted:#5b6b64;--line:#d4dbd6;--accent:#0f6b63;--accent-soft:#dcece9;
--warn:#9a5b00;--warn-soft:#f6e8cf;--ok:#1b7a43;--log-bg:#14211c;--log-ink:#cfe3da;
--pk:#0f6b63;--fk:#2b5fb3;--ak:#9a5b00;--ck:#6b3fa0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0d1512;--panel:#141f1b;--ink:#e6efe9;--muted:#93a69c;--line:#26352f;--accent:#4fb8ab;--accent-soft:#17332f;
--warn:#e3a94a;--warn-soft:#33270f;--ok:#5fcf8b;--log-bg:#0a100e;--log-ink:#bcd5c9;
--pk:#4fb8ab;--fk:#7ca6f0;--ak:#e3a94a;--ck:#b894e6}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0d1512;--panel:#141f1b;--ink:#e6efe9;--muted:#93a69c;--line:#26352f;--accent:#4fb8ab;--accent-soft:#17332f;
--warn:#e3a94a;--warn-soft:#33270f;--ok:#5fcf8b;--log-bg:#0a100e;--log-ink:#bcd5c9;
--pk:#4fb8ab;--fk:#7ca6f0;--ak:#e3a94a;--ck:#b894e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--line);background:var(--panel);padding:20px 12px}
.brand{font-weight:700;font-size:17px;padding:0 10px 14px}
nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{color:var(--ink)}
nav a[aria-current]{background:var(--accent-soft);color:var(--accent)}
main{padding:28px clamp(16px,4vw,40px);max-width:980px;width:100%}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.def{margin:0 0 20px;max-width:62ch;color:var(--muted)}
h2{font-size:16px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 14px;margin-bottom:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-weight:500;font-size:13px;color:var(--muted)}
td.sql{white-space:normal;font:12.5px/1.5 "JetBrains Mono",ui-monospace,monospace;min-width:260px;overflow-wrap:anywhere}
.tname{font:500 13px "JetBrains Mono",ui-monospace,monospace;margin:12px 0 4px}
.tname:first-child{margin-top:0}
tr.new td{background:var(--accent-soft)}
.b{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px}
.b-PK{color:var(--pk);background:color-mix(in srgb,var(--pk) 16%,transparent)}
.b-FK{color:var(--fk);background:color-mix(in srgb,var(--fk) 16%,transparent)}
.b-AK{color:var(--ak);background:color-mix(in srgb,var(--ak) 16%,transparent)}
.b-CK{color:var(--ck);background:color-mix(in srgb,var(--ck) 16%,transparent)}
.ff{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.ff>div{flex:1 1 150px}
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font:600 14px "Public Sans",system-ui,sans-serif;cursor:pointer;flex:none}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.hint{color:var(--muted);font-size:13px}
.checks{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 8px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:auto}
.res{border-radius:8px;padding:12px 14px;margin-top:12px}
.res.ok{background:var(--accent-soft);color:var(--ok)}
.res.no{background:var(--warn-soft);color:var(--warn)}
.res code{display:block;margin-top:6px;font:12.5px/1.5 "JetBrains Mono",ui-monospace,monospace;overflow-wrap:anywhere}
pre{margin:0;background:var(--log-bg);color:var(--log-ink);padding:12px;border-radius:8px;overflow:auto;font:12.5px/1.6 "JetBrains Mono",ui-monospace,monospace}
p{margin:0}
.theme{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;margin:12px 10px 0}
.ok-t{color:var(--ok);font-weight:600}.no-t{color:var(--warn);font-weight:600}
.hh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.hh h2{margin:0}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:10px;align-items:center}
 .brand{padding:0 8px 0 0;white-space:nowrap}nav a{white-space:nowrap}.theme{margin:0 0 0 8px;white-space:nowrap}
}

.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 14px 0}
.brandrow .brand{padding:0 10px}
.cfgbtn{position:relative;flex:none;width:32px;height:32px;display:grid;place-items:center;padding:0;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;cursor:pointer}
.cfgbtn:hover{color:var(--ink);border-color:var(--accent)}
.cfgbtn svg{width:17px;height:17px}
.dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--warn);border:2px solid var(--panel)}
.dot.on{background:var(--ok)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 16px 48px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,16,14,.55)}
.dlg{padding:20px}
.dlg h2{margin:0 0 4px;font-size:17px}
.dlg label.f{margin-top:14px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0}
.dlg .hint{margin-top:12px}
.okmsg{color:var(--ok)}
.rem{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer}
.rem input{width:auto}
.dlgfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:16px}
.dlgfoot .gap{margin-right:auto}
@media (max-width:820px){.brandrow{padding:0;flex:none;gap:10px}.brandrow .brand{padding:0;white-space:nowrap}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Key types"></nav>
  <main>
    <div class="top">
      <div><h1 id="title"></h1><p class="def" id="def"></p></div>
      <button class="btn ghost" id="reset" type="button">Reset sample data</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<dialog id="cfg" aria-labelledby="cfgTitle">
  <form id="cfgForm" class="dlg" autocomplete="off">
    <h2 id="cfgTitle">Supabase setup</h2>
    <p class="hint" style="margin-top:0">Find both values in your Supabase project under Project Settings, then API.</p>
    <label class="f" for="sbUrl">Project URL</label>
    <input id="sbUrl" type="text" inputmode="url" spellcheck="false" autocomplete="off" placeholder="https://abcdxyz.supabase.co">
    <label class="f" for="sbKey">Publishable key</label>
    <div class="keyrow">
      <input id="sbKey" type="password" spellcheck="false" autocomplete="off" placeholder="sb_publishable_… or anon key">
      <button class="chip" id="showkey" type="button">Show</button>
    </div>
    <label class="rem"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <p class="hint" id="connMsg" aria-live="polite"></p>
    <div class="dlgfoot">
      <button class="chip gap" id="disc" type="button" hidden>Disconnect and forget</button>
      <button class="btn ghost" id="cfgclose" type="button">Close</button>
      <button class="btn" id="connect" type="submit">Connect</button>
    </div>
  </form>
</dialog>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'NULL':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var sb=null,connected=false,busy=false,host='',connMsg='',cfg={url:'',key:''};
var db={engines:[],engine_versions:[],regions:[],deployments:[]},hist=[],lastKey=null,res=null;
var TABLES=['engines','engine_versions','regions','deployments'];

/* ---------- plain-English reasons for real Postgres errors ---------- */
function why(e){
  var m=e.message||'',c=e.code;
  if(c==='23505'){
    if(/engines_pkey/.test(m))return 'Another engine already has this primary key value, so the two rows could not be told apart.';
    if(/engine_versions_pkey/.test(m))return 'This exact pair of engine and version already exists. Either column alone may repeat, but the pair may not.';
    if(/regions_code_key/.test(m))return 'The region code is an alternate key, so it must stay unique.';
    if(/deployments_name_key/.test(m))return 'The deployment name is an alternate key. It could have been the primary key, so the database keeps it unique.';
    return 'A primary key or alternate key rule was broken: the value already exists.';
  }
  if(c==='23503'){
    if(/update or delete/.test(m))return 'Other rows still point to this row. “on delete restrict” blocks the delete so nothing is left pointing at a missing row.';
    if(/region_id/.test(m))return 'That region id does not exist in regions. A foreign key must point to a real primary key value.';
    if(/engine_versions_engine_fkey/.test(m))return 'That engine does not exist in the engines table.';
    if(/engine_version/.test(m))return 'That engine and version pair does not exist in engine_versions.';
    return 'A foreign key points to a value that does not exist.';
  }
  if(c==='23514'){
    if(/storage_gb/.test(m))return 'Storage must be a whole number from 20 to 2000 GB (the storage_gb domain).';
    if(/environment/.test(m))return 'Environment must be Production, Staging or Development.';
    return 'A value is outside the allowed domain for its column.';
  }
  if(c==='23502')return 'A required column was left empty. Primary keys and NOT NULL columns can never be NULL.';
  if(c==='22P02')return 'A value has the wrong data type, such as text where a number is expected.';
  if(c==='42501')return 'Permission or Row Level Security blocked this. Run the latest schema.sql in the SQL Editor.';
  if(c==='42P01'||c==='PGRST205')return 'A table is missing. Run schema.sql in the SQL Editor first.';
  if(c==='PGRST202')return 'The reset function is missing. Run the latest schema.sql in the SQL Editor.';
  return m||'Unknown error';
}
function isSecret(key){
  if(/^sb_secret_/.test(key))return true;
  try{return JSON.parse(atob(key.split('.')[1])).role==='service_role'}catch(e){return false}
}

/* ---------- data layer: every call below is a real query ---------- */
function loadAll(){
  return Promise.all(TABLES.map(function(t){
    var q=sb.from(t).select('*');
    q=t==='regions'?q.order('id'):t==='engines'?q.order('name'):t==='engine_versions'?q.order('engine').order('version'):q.order('created_at').order('name');
    return q.then(function(r){if(r.error)throw r.error;db[t]=r.data});
  }));
}
function loadHist(){
  return sb.from('query_log').select('*').order('id',{ascending:false}).limit(12).then(function(r){if(r.error)throw r.error;hist=r.data});
}
function q(v){return v==null?'null':typeof v==='number'?String(v):"'"+String(v).replace(/'/g,"''")+"'"}
function sqlIns(t,r){var k=Object.keys(r);return 'insert into '+t+' ('+k.join(', ')+') values ('+k.map(function(x){return q(r[x])}).join(', ')+');'}
function rowKey(t,r){return t==='engines'?r.name:t==='engine_versions'?r.engine+'|'+r.version:r.id}
function fail(e){busy=false;res={ok:false,code:e.code||'network',msg:e.message||'Request failed',why:e.code?why(e):'Could not reach Supabase. Check your connection and the project URL.',sql:''};drawAll()}
/* record the attempt in query_log, refresh tables and history, then redraw */
function finish(key,sql,err,okMsg){
  res=err?{ok:false,code:err.code||'error',msg:err.message,det:err.details,why:why(err),sql:sql}:{ok:true,msg:okMsg,sql:sql};
  return sb.from('query_log').insert({key_type:key,statement:sql,succeeded:!err,error_code:err?(err.code||'error'):null,message:err?err.message:null})
    .then(function(){return Promise.all([loadAll(),loadHist()])})
    .then(function(){busy=false;drawAll()}).catch(fail);
}
function insMsg(t,r){
  if(t==='engines')return 'Row added to engines.';
  if(t==='engine_versions')return 'Row added. The pair ('+r.engine+', '+r.version+') is new, even if each part appears elsewhere.';
  if(t==='regions')return 'Row added. The database chose id = '+r.id+' by itself.';
  return 'Row added. The database generated id = '+String(r.id).slice(0,8)+'… by itself.';
}

var COLS={
  engines:[{k:'name',b:['PK']}],
  engine_versions:[{k:'engine',b:['PK','FK']},{k:'version',b:['PK']}],
  regions:[{k:'id',b:['PK']},{k:'code',b:['AK']},{k:'label',b:[]}],
  deployments:[{k:'id',b:['PK']},{k:'name',b:['AK']},{k:'environment',b:[]},{k:'engine',b:['FK']},{k:'engine_version',b:['FK']},{k:'region_id',b:['FK']},{k:'storage',b:[]}]
};
var FIELDS={
  engines:{name:{l:'Engine name',v:'Redis'}},
  engine_versions:{engine:{l:'Engine',v:'PostgreSQL'},version:{l:'Version',v:'18'}},
  regions:{code:{l:'Region code',v:'ap-northeast-1'},label:{l:'Label',v:'Tokyo'}},
  deployments:{name:{l:'Deployment name',v:'inventory-prod'},environment:{l:'Environment',v:'Production'},engine:{l:'Engine',v:'PostgreSQL'},engine_version:{l:'Engine version',v:'16'},region_id:{l:'Region id',v:'1',t:'number'},storage:{l:'Storage (GB)',v:'100',t:'number'}}
};
var DEPCOLS=['id','name','environment','engine','storage','region_id'];

var TABS=[
{id:'overview',n:'Overview',def:'Keys uniquely identify records, connect tables and protect data integrity. Pick a key on the left, then try to break it. Every attempt runs as a real query in your Supabase database.'},
{id:'domain',n:'Domain',def:'A domain is the set of valid values allowed in a column. It stops invalid data from being stored.',
 tb:['deployments'],form:{table:'deployments',f:['environment','storage'],btn:'Insert deployment'},
 try:[{l:'Environment “Testing”',s:{environment:'Testing'}},{l:'5000 GB',s:{storage:'5000'}},{l:'Valid values',s:{environment:'Production',storage:'250'}}],
 note:'Environment must be Production, Staging or Development. Storage must be a whole number from 20 to 2000.',
 sql:"create domain storage_gb as integer\n  check (value between 20 and 2000);\n\n-- in the deployments table:\nenvironment text not null\n  check (environment in ('Production','Staging','Development')),\nstorage storage_gb not null default 100"},
{id:'primary',n:'Primary key',def:'A primary key is a column (or set of columns) that uniquely identifies each record in a table. It cannot be NULL or duplicated.',
 tb:['engines'],form:{table:'engines',f:['name'],btn:'Insert engine'},
 try:[{l:'Duplicate “MySQL”',s:{name:'MySQL'}},{l:'Empty value',s:{name:''}},{l:'New engine “Redis”',s:{name:'Redis'}}],
 note:'Each value must be unique and can never be NULL. It identifies one and only one row, which also makes searching fast.',
 sql:"create table engines (\n  name text primary key\n);"},
{id:'surrogate',n:'Surrogate key',def:'A surrogate key is a system-generated unique identifier with no business meaning, used only as a primary key.',
 tb:['regions','deployments'],join:1,form:{table:'regions',f:['code','label'],btn:'Insert region'},extra:'rename',
 try:[{l:'Add Tokyo',s:{code:'ap-northeast-1',label:'Tokyo'}}],
 note:'You never type the id. The database numbers rows itself, and the number means nothing outside the table. So when real-world details such as a label change, the id and every link to it stay the same.',
 sql:"create table regions (\n  id integer generated always as identity primary key,\n  code text not null unique,\n  label text not null\n);\n\n-- deployments also uses a generated id:\nid uuid primary key default gen_random_uuid()"},
{id:'candidate',n:'Candidate key',def:'A candidate key is a column or set of columns that can uniquely identify a record. A table can have several.',
 tb:['deployments'],bd:{deployments:{id:['CK'],name:['CK']}},extra:'check',
 pre:[['id'],['name'],['environment'],['engine'],['environment','storage']],
 note:'A real key must stay unique for every future row, not only today’s rows. The checker only sees today’s data, so use judgement: two deployments can share a storage size tomorrow, but should never share a name.',
 sql:"-- Candidate keys of deployments: id and name.\n-- Both are unique and not null.\nid   uuid primary key default gen_random_uuid(),\nname text not null unique"},
{id:'alternate',n:'Alternate key',def:'An alternate key is a candidate key that was not chosen as the primary key. It can still uniquely identify records.',
 tb:['deployments'],bd:{deployments:{id:['PK'],name:['AK']}},form:{table:'deployments',f:['name'],btn:'Insert deployment'},
 try:[{l:'Reuse “orders-prod”',s:{name:'orders-prod'}},{l:'New name',s:{name:'inventory-prod'}}],
 note:'id and name could both identify a deployment. We picked id as the primary key, so name became an alternate key. The database still refuses duplicate names.',
 sql:"id   uuid primary key default gen_random_uuid(),  -- chosen: primary key\nname text not null unique                      -- not chosen: alternate key"},
{id:'composite',n:'Composite key',def:'A composite key is a combination of two or more columns that together uniquely identify each record in a table.',
 tb:['engine_versions'],form:{table:'engine_versions',f:['engine','version'],btn:'Insert version'},
 try:[{l:'PostgreSQL 16 again',s:{engine:'PostgreSQL',version:'16'}},{l:'PostgreSQL 18',s:{engine:'PostgreSQL',version:'18'}},{l:'MySQL 7.0 (7.0 already exists for MongoDB)',s:{engine:'MySQL',version:'7.0'}},{l:'Engine “Oracle”',s:{engine:'Oracle',version:'23'}}],
 note:'Neither column is unique alone: PostgreSQL appears three times and version 8.0 appears twice. Only the pair is unique.',
 sql:"create table engine_versions (\n  engine  text not null references engines(name) on update cascade,\n  version text not null,\n  primary key (engine, version)\n);"},
{id:'super',n:'Super key',def:'A super key is any combination of columns that can uniquely identify a record. It may include extra columns.',
 tb:['deployments'],extra:'check',pre:[['id'],['id','name'],['name','environment'],['environment']],
 note:'Every candidate key is a super key, but a super key may carry extra columns. {id, name} is unique, yet one of its columns can be removed and it stays unique. A super key is a concept you reason about, not something you declare in SQL.',
 sql:"-- Nothing to declare. For deployments, these are super keys:\n--   {id}   {name}   {id, name}   {id, environment}\n-- The smallest ones, {id} and {name}, are the candidate keys."},
{id:'foreign',n:'Foreign key',def:'A foreign key is a column in one table that refers to the primary key of another table.',
 tb:['regions','deployments'],join:1,form:{table:'deployments',f:['engine','engine_version','region_id'],btn:'Insert deployment'},
 try:[{l:'Region 3',s:{region_id:'3'}},{l:'Region 99',s:{region_id:'99'}},{l:'PostgreSQL 99',s:{engine_version:'99'}}],
 note:'region_id in deployments must match an id in regions. The joined column shows the link being followed. The pair (engine, engine_version) is a composite foreign key to engine_versions.',
 sql:"region_id integer not null\n  references regions(id) on delete restrict,\n\nforeign key (engine, engine_version)\n  references engine_versions(engine, version)"},
{id:'integrity',n:'Referential integrity',def:'Referential integrity keeps relationships between tables valid by enforcing rules between a foreign key and a primary key.',
 tb:['regions','deployments'],join:1,form:{table:'deployments',f:['region_id'],btn:'Insert deployment'},extra:'delete',
 try:[{l:'Add with region 99',s:{region_id:'99'}},{l:'Add with region 4',s:{region_id:'4'}}],
 note:'The rules work in both directions: you cannot point to a parent that does not exist, and you cannot delete a parent that still has children. Add a new region on the Surrogate key page, then delete it here to see a delete that is allowed.',
 sql:"-- on delete restrict: refuse to delete a region that is still used\nregion_id integer not null\n  references regions(id) on delete restrict"}
];
TABS=['overview','domain','primary','foreign','candidate','composite','alternate','integrity','surrogate','super'].map(function(id){return TABS.filter(function(t){return t.id===id})[0]});
var tab=TABS[0];
function cur(){return tab}

/* ---------- drawing ---------- */
function tbl(name,t){
  var ov=(t.bd||{})[name]||{},h='<div class="tname">'+name+'</div><div class="scroll"><table><thead><tr>';
  COLS[name].forEach(function(c){var b=ov[c.k]||c.b;h+='<th>'+c.k+b.map(function(x){return '<span class="b b-'+x+'">'+x+'</span>'}).join('')+'</th>'});
  if(name==='deployments'&&t.join)h+='<th>region (joined)</th>';
  h+='</tr></thead><tbody>';
  if(!db[name].length)h+='<tr><td colspan="9">No rows. Use Reset sample data to restore them.</td></tr>';
  db[name].forEach(function(r){
    h+='<tr'+(name+':'+rowKey(name,r)===lastKey?' class="new"':'')+'>';
    COLS[name].forEach(function(c){var v=r[c.k];if(name==='deployments'&&c.k==='id')v=String(v).slice(0,8)+'…';h+='<td>'+esc(v)+'</td>'});
    if(name==='deployments'&&t.join){var g=db.regions.filter(function(x){return x.id===r.region_id})[0];h+='<td>'+esc(g?g.label:'')+'</td>'}
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
function drawHist(){
  var h=$('#hist');if(!h)return;
  h.innerHTML=hist.length?'<div class="scroll"><table><thead><tr><th>Time</th><th>Key</th><th>Statement that ran</th><th>Result</th></tr></thead><tbody>'+
    hist.map(function(x){
      var t=TABS.filter(function(z){return z.id===x.key_type})[0];
      return '<tr><td>'+esc(new Date(x.created_at).toLocaleTimeString())+'</td><td>'+esc(t?t.n:x.key_type)+'</td><td class="sql">'+esc(x.statement)+'</td><td>'+(x.succeeded?'<span class="ok-t">Accepted</span>':'<span class="no-t">Rejected '+esc(x.error_code)+'</span>')+'</td></tr>'}).join('')+
    '</tbody></table></div>':'<p class="hint">Nothing yet. Every statement you run on the key pages is stored here, in your query_log table.</p>';
}
function drawAll(){
  var t=cur(),r=res,e=$('#res');
  [].forEach.call(document.querySelectorAll('main .btn,main .chip'),function(b){if(b.id!=='disc')b.disabled=busy});
  if(!$('#tables')){drawHist();return}
  $('#tables').innerHTML=t.tb.map(function(n){return tbl(n,t)}).join('');
  if(r){
    e.hidden=false;e.className='res '+(r.ok?'ok':'no');
    e.innerHTML=(r.ok?'<b>Accepted.</b> '+esc(r.msg):'<b>Rejected ('+esc(r.code)+').</b> '+esc(r.why))+
      (r.sql?'<code>Ran: '+esc(r.sql)+'</code>':'')+(r.ok?'':'<code>ERROR: '+esc(r.msg)+(r.det?' · '+esc(r.det):'')+'</code>');
  }else e.hidden=true;
  var d=$('#del');
  if(d){var v=d.value;d.innerHTML=db.regions.map(function(g){
    var n=db.deployments.filter(function(x){return x.region_id===g.id}).length;
    return '<option value="'+g.id+'">'+g.id+' · '+esc(g.label)+' ('+n+' deployment'+(n===1?'':'s')+')</option>'}).join('');
    if(v)d.value=v}
  runCheck();drawHist();
}
function formHTML(t){
  if(!t.form)return '';
  var h='<form id="f" class="ff" autocomplete="off">';
  t.form.f.forEach(function(id){var d=FIELDS[t.form.table][id];
    h+='<div><label class="f" for="in-'+id+'">'+d.l+'</label><input id="in-'+id+'" type="'+(d.t||'text')+'" value="'+esc(d.v)+'"></div>'});
  h+='<button class="btn" type="submit">'+t.form.btn+'</button></form>';
  if(t.try){h+='<div class="chips"><span class="hint">Quick tests:</span>';
    t.try.forEach(function(c,i){h+='<button type="button" class="chip" data-try="'+i+'">'+c.l+'</button>'});h+='</div>'}
  return h;
}
function extraHTML(t){
  var h='';
  if(t.extra==='rename')h='<div class="chips"><button type="button" class="chip" id="ren">Rename region 1</button><span class="hint">Watch the id stay the same while the label changes.</span></div>';
  if(t.extra==='delete')h='<div class="ff"><div><label class="f" for="del">Delete a region</label><select id="del"></select></div><button class="btn" id="delbtn" type="button">Delete region</button></div>';
  if(t.extra==='check'){
    h='<p class="hint">Tick columns of deployments. Is that set a key? The check uses the rows currently in your database.</p><div class="checks" id="cols">'+
      DEPCOLS.map(function(c){return '<label><input type="checkbox" value="'+c+'"'+(c==='id'?' checked':'')+'>'+c+'</label>'}).join('')+'</div>'+
      '<div class="chips"><span class="hint">Presets:</span>'+t.pre.map(function(p,i){return '<button type="button" class="chip" data-pre="'+i+'">{'+p.join(', ')+'}</button>'}).join('')+'</div>'+
      '<div class="res" id="chk"></div>';
  }
  return h;
}
function uniq(cs){
  var seen={};
  return db.deployments.every(function(r){var k=cs.map(function(c){return String(r[c])}).join('\u0001');if(seen[k])return false;seen[k]=1;return true});
}
function runCheck(){
  var box=$('#chk');if(!box)return;
  var cs=[].slice.call(document.querySelectorAll('#cols input:checked')).map(function(i){return i.value}),set='{'+cs.join(', ')+'}';
  if(!cs.length){box.className='res';box.textContent='Tick at least one column.';return}
  if(!uniq(cs)){box.className='res no';box.innerHTML='<b>Not a key.</b> '+set+' repeats in at least two rows, so it cannot identify a single record.';return}
  var extra=cs.length>1?cs.filter(function(c){return uniq(cs.filter(function(x){return x!==c}))}):[];
  box.className='res ok';
  box.innerHTML=!extra.length?'<b>Candidate key.</b> '+set+' is unique and no column can be removed. It is also a super key.'
    :'<b>Super key, but not a candidate key.</b> '+set+' is unique, yet you can remove '+extra.join(' or ')+' and it stays unique.';
}
function overview(){
  var rows=[['primary','Primary key','Uniquely identifies each record in a table','engines.name'],['foreign','Foreign key','Links one table to another','deployments.region_id'],['candidate','Candidate key','A column or set of columns that could identify a record','id, name'],['composite','Composite key','Two or more columns that together identify a record','(engine, version)'],['alternate','Alternate key','A candidate key not chosen as the primary key','deployments.name'],['integrity','Referential integrity','Keeps those links valid in both directions','regions ↔ deployments'],['surrogate','Surrogate key','System-generated identifier with no business meaning','regions.id'],['super','Super key','Any set of columns that identifies a record, extras allowed','{id, name}']];
  return '<section class="card"><h2>All the keys at a glance</h2><div class="scroll"><table><thead><tr><th>Key</th><th>Purpose</th><th>Example here</th></tr></thead><tbody>'+
    rows.map(function(r){return '<tr><td><a href="#'+r[0]+'">'+r[1]+'</a></td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>'}).join('')+
    '</tbody></table></div></section><section class="card"><h2>How to use this page</h2><p>Each page shows live tables from your Supabase database. Insert a row, delete one, or test a column, and Postgres itself accepts or rejects it, so the error you see is the real one. Key columns carry badges: <span class="b b-PK">PK</span> primary, <span class="b b-FK">FK</span> foreign, <span class="b b-AK">AK</span> alternate, <span class="b b-CK">CK</span> candidate. Reset sample data restores the starting rows.</p></section>';
}
function render(){
  var t=cur();
  $('#title').textContent=t.n;$('#def').textContent=t.def;
  document.title=t.n+' · Database key explorer';
  [].forEach.call(document.querySelectorAll('#nav a'),function(a){if(a.getAttribute('href')==='#'+t.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(!connected){$('#view').innerHTML='<section class="card"><h2>Connect to your database first</h2><p>1. Run <b>schema.sql</b> in the Supabase SQL Editor.<br>2. Click the wrench button, paste your project URL and publishable key, then press Connect.</p><div class="chips"><button class="chip" id="cfgopen" type="button">Open setup</button></div>'+(connMsg?'<p class="hint">'+esc(connMsg)+'</p>':'')+'</section>';return}
  var hist='<section class="card"><div class="hh"><h2>Saved query history</h2><button class="chip" id="clr" type="button">Clear history</button></div><div id="hist"></div></section>';
  if(t.id==='overview'){$('#view').innerHTML=overview()+hist;drawHist();return}
  $('#view').innerHTML='<section class="card"><h2>Sample data</h2><div id="tables"></div></section>'+
    '<section class="card"><h2>Try it</h2>'+formHTML(t)+extraHTML(t)+'<div id="res" class="res" aria-live="polite" hidden></div></section>'+
    '<section class="card"><h2>What to notice</h2><p>'+t.note+'</p></section>'+
    '<section class="card"><h2>The SQL behind it</h2><pre>'+esc(t.sql)+'</pre></section>'+hist;
  drawAll();
}
var WRENCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>';
function drawConn(){
  var d=$('#dot'),b=$('#cfgbtn'),m=$('#connMsg'),x=$('#disc'),c=$('#connect');
  if(d)d.className='dot'+(connected?' on':'');
  if(b){var l=connected?'Connection setup (connected)':'Connection setup';b.title=l;b.setAttribute('aria-label',l)}
  if(m){m.textContent=connected?'Connected. Every attempt runs as a real query and is saved.':(connMsg||'Never paste the secret key here. Only the publishable (anon) key belongs in browser code.');m.className='hint'+(connected?' okmsg':'')}
  if(x)x.hidden=!connected;
  if(c)c.textContent=connected?'Reconnect':'Connect';
}
function openCfg(){
  var d=$('#cfg');if(!d)return;
  drawConn();
  if(d.showModal){if(!d.open)d.showModal()}else d.setAttribute('open','');
  var f=$(connected?'#cfgclose':'#sbUrl');if(f)f.focus();
}
function closeCfg(){var d=$('#cfg');if(!d)return;if(d.close)d.close();else d.removeAttribute('open')}

/* ---------- actions ---------- */
function submitForm(){
  if(busy)return;
  var t=cur(),tb=t.form.table,row={};
  t.form.f.forEach(function(id){var v=$('#in-'+id).value.trim(),d=FIELDS[tb][id];row[id]=d.t==='number'?(v===''?null:Number(v)):(v===''?null:v)});
  if(tb==='deployments'){
    var base={environment:'Staging',engine:'PostgreSQL',engine_version:'16',region_id:1,size:'Small',storage:100};
    for(var k in base)if(!(k in row))row[k]=base[k];
    if(!('name' in row))row.name='demo-'+Date.now().toString(36).slice(-5);
  }
  busy=true;drawAll();
  sb.from(tb).insert(row).select().single().then(function(r){
    if(!r.error)lastKey=tb+':'+rowKey(tb,r.data);
    return finish(t.id,sqlIns(tb,row),r.error,r.error?null:insMsg(tb,r.data));
  }).catch(fail);
}
function rename(){
  if(busy)return;
  var g=db.regions.filter(function(x){return x.id===1})[0];
  if(!g){res={ok:false,code:'none',msg:'Region 1 does not exist',why:'Region 1 was deleted. Use Reset sample data to bring it back.',sql:''};drawAll();return}
  var label=g.label==='Singapore'?'Singapore (SG)':'Singapore',sql='update regions set label = '+q(label)+' where id = 1;';
  busy=true;drawAll();
  sb.from('regions').update({label:label}).eq('id',1).select().then(function(r){
    if(!r.error&&!(r.data&&r.data.length))r.error={code:'42501',message:'No row was updated'};
    if(!r.error)lastKey='regions:1';
    return finish('surrogate',sql,r.error,'Label changed to “'+label+'”. id = 1 stayed the same, so every deployment that points to region 1 is still linked, as the joined column shows.');
  }).catch(fail);
}
function delRegion(){
  if(busy)return;
  var id=+$('#del').value;if(!id)return;
  busy=true;drawAll();lastKey=null;
  sb.from('regions').delete().eq('id',id).select().then(function(r){
    if(!r.error&&!(r.data&&r.data.length))r.error={code:'42501',message:'No row was deleted'};
    return finish('integrity','delete from regions where id = '+id+';',r.error,'Region deleted. No deployment pointed to it, so nothing was left dangling.');
  }).catch(fail);
}
function resetDemo(){
  if(!connected||busy)return;
  busy=true;drawAll();
  sb.rpc('reset_demo').then(function(r){
    if(r.error)throw r.error;
    lastKey=null;res={ok:true,msg:'Sample data restored. Your saved query history was kept.',sql:'select reset_demo();'};
    return Promise.all([loadAll(),loadHist()]);
  }).then(function(){busy=false;drawAll()}).catch(fail);
}
function clearHist(){
  if(busy)return;busy=true;drawAll();
  sb.from('query_log').delete().gte('id',0).then(function(r){if(r.error)throw r.error;return loadHist()}).then(function(){busy=false;drawAll()}).catch(fail);
}
function connect(){
  var url=$('#sbUrl').value.trim().replace(/\/$/,''),key=$('#sbKey').value.trim();
  cfg.url=url;cfg.key=key;
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key){connMsg='Enter a project URL like https://abcdxyz.supabase.co and your publishable key.';drawConn();return}
  if(isSecret(key)){connMsg='That is a secret key. Use the publishable (anon) key in browser code.';drawConn();return}
  if(!window.supabase){connMsg='The Supabase library did not load. Check your internet connection.';drawConn();return}
  sb=window.supabase.createClient(url,key);
  connMsg='Connecting…';drawConn();
  Promise.all([loadAll(),loadHist()]).then(function(){
    connected=true;host=url.replace('https://','');connMsg='';
    try{if($('#remember').checked){localStorage.setItem('sbUrl',url);localStorage.setItem('sbKey',key)}else{localStorage.removeItem('sbUrl');localStorage.removeItem('sbKey')}}catch(e){}
    drawConn();closeCfg();route();
  }).catch(function(e){connected=false;connMsg='Could not load data: '+why(e);drawConn();render()});
}
function route(){
  var id=location.hash.slice(1);
  tab=TABS.filter(function(x){return x.id===id})[0]||TABS[0];
  res=null;lastKey=null;render();
}

/* ---------- wiring ---------- */
$('#nav').innerHTML='<div class="brandrow"><div class="brand">Key explorer</div><button class="cfgbtn" id="cfgbtn" type="button" title="Connection setup" aria-label="Connection setup">'+WRENCH+'<span class="dot" id="dot"></span></button></div>'+TABS.map(function(t){return '<a href="#'+t.id+'">'+t.n+'</a>'}).join('')+'<button class="theme" id="theme" type="button">Switch theme</button>';
document.addEventListener('submit',function(e){if(e.target.id==='f'){e.preventDefault();submitForm()}else if(e.target.id==='cfgForm'){e.preventDefault();connect()}});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-try],[data-pre],#ren,#delbtn,#theme,#cfgbtn,#cfgopen,#cfgclose,#showkey,#disc,#clr');if(!el)return;
  var t=cur();
  if(el.dataset.try!==undefined){if(busy)return;var s=t.try[+el.dataset.try].s;for(var k in s){var i=$('#in-'+k);if(i)i.value=s[k]}submitForm()}
  else if(el.dataset.pre!==undefined){var p=t.pre[+el.dataset.pre];[].forEach.call(document.querySelectorAll('#cols input'),function(c){c.checked=p.indexOf(c.value)>=0});runCheck()}
  else if(el.id==='ren')rename();
  else if(el.id==='delbtn')delRegion();
  else if(el.id==='clr')clearHist();
  else if(el.id==='cfgbtn'||el.id==='cfgopen')openCfg();
  else if(el.id==='cfgclose')closeCfg();
  else if(el.id==='showkey'){var k=$('#sbKey');k.type=k.type==='password'?'text':'password';el.textContent=k.type==='password'?'Show':'Hide'}
  else if(el.id==='disc'){sb=null;connected=false;connMsg='';cfg.url='';cfg.key='';$('#sbUrl').value='';$('#sbKey').value='';try{localStorage.removeItem('sbUrl');localStorage.removeItem('sbKey')}catch(x){}drawConn();render()}
  else if(el.id==='theme'){var r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dk?'light':'dark'}
});
document.addEventListener('change',function(e){if(e.target.closest('#cols'))runCheck()});
$('#reset').addEventListener('click',resetDemo);
window.addEventListener('hashchange',route);
try{cfg.url=localStorage.getItem('sbUrl')||'';cfg.key=localStorage.getItem('sbKey')||''}catch(e){}
$('#sbUrl').value=cfg.url;$('#sbKey').value=cfg.key;
$('#cfg').addEventListener('click',function(e){if(e.target===this)closeCfg()});
drawConn();route();
if(cfg.url&&cfg.key)connect();
})();
</script>
</body>
</html>
